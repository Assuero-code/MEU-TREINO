<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Meu Treino</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --success: #22c55e;
            --border: #334155;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 15px; padding-bottom: 100px;
        }

        .day-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px; margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .day-title {
            color: var(--accent-color);
            font-weight: bold; border-bottom: 1px solid var(--border);
            padding-bottom: 10px; margin-bottom: 15px;
            display: flex; justify-content: space-between;
        }

        .exercise-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 0; border-bottom: 1px solid var(--border);
        }

        /* Imagem com fallback (se não carregar, mostra fundo escuro) */
        .ex-img {
            width: 70px; height: 70px;
            border-radius: 8px; object-fit: cover;
            background-color: #000;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .exercise-info { flex-grow: 1; }
        .ex-name { display: block; font-weight: bold; font-size: 1rem; }
        .ex-details { font-size: 0.85rem; color: #94a3b8; }

        .checkbox-wrapper {
            width: 28px; height: 28px;
            border: 2px solid var(--accent-color);
            border-radius: 6px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }

        .completed .checkbox-wrapper { background: var(--success); border-color: var(--success); }
        .completed .checkbox-wrapper::after { content: '✓'; color: white; font-weight: bold; }
        .completed .ex-img, .completed .exercise-info { opacity: 0.3; }

        .btn-reset {
            position: fixed; bottom: 20px; left: 5%; width: 90%;
            background: #ef4444; color: white; border: none;
            padding: 15px; border-radius: 30px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="workout-container">
        <!-- SEGUNDA -->
        <section class="day-section">
            <div class="day-title">SEGUNDA <span>Peito + Tríceps</span></div>
            
            <div class="exercise-item" onclick="toggleTask(this)">
                <div class="checkbox-wrapper"></div>
                <!-- Altere o nome do arquivo abaixo conforme você subir para o GitHub -->
                <img src="img/supino.gif" onerror="this.src='https://placehold.co/100x100/1e293b/38bdf8?text=Treino'" class="ex-img">
                <div class="exercise-info">
                    <span class="ex-name">1. Chest Press</span>
                    <span class="ex-details">4x 8-10 reps</span>
                </div>
            </div>

            <div class="exercise-item" onclick="toggleTask(this)">
                <div class="checkbox-wrapper"></div>
                <img src="img/triceps.gif" onerror="this.src='https://placehold.co/100x100/1e293b/38bdf8?text=Treino'" class="ex-img">
                <div class="exercise-info">
                    <span class="ex-name">2. Tríceps Corda</span>
                    <span class="ex-details">3x 10-12 reps</span>
                </div>
            </div>
        </section>
        
        <!-- Adicione os outros dias seguindo o mesmo modelo -->
    </div>

    <button class="btn-reset" onclick="resetWeek()">REINICIAR SEMANA</button>

    <script>
        function toggleTask(el) {
            el.classList.toggle('completed');
            const progress = Array.from(document.querySelectorAll('.exercise-item')).map(ex => ex.classList.contains('completed'));
            localStorage.setItem('treino_progresso', JSON.stringify(progress));
        }

        window.onload = () => {
            const saved = JSON.parse(localStorage.getItem('treino_progresso'));
            if (saved) {
                document.querySelectorAll('.exercise-item').forEach((ex, i) => {
                    if (saved[i]) ex.classList.add('completed');
                });
            }
        };

        function resetWeek() {
            if(confirm("Reiniciar semana?")) {
                localStorage.removeItem('treino_progresso');
                location.reload();
            }
        }
    </script>
</body>
</html>
