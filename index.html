    <style>

            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;
            --radius-xl: 22px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.5);

        * {

            margin: 0;
            padding: 0;

            user-select: none;
        }

        body {

                radial-gradient(circle at 90% 80%, rgba(129, 140, 248, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: calc(140px + var(--safe-area-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-wrapper {
            width: 100%;
            max-width: 768px;
            padding: 16px 16px 0 16px;
        }

        header {
            margin-bottom: 20px;
            padding: 12px 4px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;

            -webkit-text-fill-color: transparent;

            border: 1px solid rgba(56, 189, 248, 0.25);
            letter-spacing: 0.5px;
        }

        .progress-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow-card);
        }

        .user-info-banner {
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            gap: 15px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;

            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;

        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-gradient);
            border-radius: 10px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .day-tabs-container {
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 0;
            margin-left: -16px;
            margin-right: -16px;
            padding-left: 16px;
            padding-right: 16px;
        }

        .day-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .day-tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            flex: 0 0 auto;
            padding: 10px 18px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .tab-btn .tab-sub {
            font-size: 0.65rem;
            font-weight: 500;
            opacity: 0.7;
        }

        .tab-btn.active {
            background: var(--accent-gradient);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 16px var(--accent-glow);
            transform: translateY(-2px);
        }

        .day-section {
            display: none;
            animation: fadeIn 0.35s ease-in-out forwards;
        }
        .day-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .muscle-group-tag {
            font-size: 0.8rem;
            color: var(--accent-primary);
            font-weight: 600;
            background: rgba(56, 189, 248, 0.1);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .exercise-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 14px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow-card);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .exercise-card.completed {
            background: rgba(16, 185, 129, 0.05);
            border-color: rgba(16, 185, 129, 0.25);
        }

        .exercise-main-row {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
        }

        .checkbox-btn {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: 2px solid var(--card-border);
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.25s ease;
            font-size: 0.9rem;
            color: transparent;
        }

        .exercise-card.completed .checkbox-btn {
            background: var(--success-gradient);
            border-color: transparent;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }

        .ex-img-wrapper {
            width: 68px;
            height: 68px;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            flex-shrink: 0;
        }

        .ex-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .exercise-info {
            flex: 1;
            min-width: 0;
        }

        .ex-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .anatomy-info {
            font-size: 0.7rem;
            margin-bottom: 4px;
        }
        .primary-muscle { color: var(--accent-primary); font-weight: 700; }
        .secondary-muscles { color: var(--text-muted); }

        .ex-details-row {
            display: flex;
            align-items: center;
            justify-content: space-between; 
            gap: 8px;
        }

        .ex-sets-badge {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent-primary);
            background: rgba(56, 189, 248, 0.12);
            padding: 2px 8px;
            border-radius: 6px;
        }

        .exercise-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn-sm {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .action-btn-sm.delete:hover { color: var(--danger-color); border-color: var(--danger-color); }

        .exercise-extra-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-top: 8px;
            border-top: 1px dashed rgba(255, 255, 255, 0.08);
        }

        .load-input-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .load-input {
            width: 50px;
            background: transparent;
            border: none;
            color: var(--accent-primary);
            font-weight: 700;
            outline: none;
            text-align: right;
        }

        .add-ex-container {
            margin-top: 20px;
            padding: 10px 0;
        }

        .btn-add-exercise {
            width: 100%;
            padding: 15px;
            border-radius: var(--radius-lg);
            background: rgba(56, 189, 248, 0.05);
            border: 2px dashed var(--card-border);
            color: var(--accent-primary);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-add-exercise:hover { background: rgba(56, 189, 248, 0.1); border-color: var(--accent-primary); }

        /* [MODALS & FORMS] */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--bg-dark);
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: var(--accent-primary);
        }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .form-input, .form-select {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
        }

        .onboarding-screen { display: none; }
        .onboarding-screen.active { display: block; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        /* [NAV & TIMER] */
        .timer-widget {
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            opacity: 0;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-primary);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 990;
            transition: all 0.3s;
        }
        .timer-widget.active { transform: translateX(-50%) translateY(0); opacity: 1; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            padding: 12px 16px calc(12px + var(--safe-area-bottom)) 16px;
            display: flex;
            justify-content: center;
            z-index: 1000;
        }

        .nav-content { width: 100%; max-width: 768px; display: flex; gap: 12px; }
        .btn-action { flex: 1; padding: 14px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-reset { background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-quick-timer { background: var(--accent-gradient); color: #ffffff; }

        @media (min-width: 640px) {
            .exercise-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
            .add-ex-container { grid-column: span 2; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <header>
            <div class="header-top">
                <div class="brand-title"><i class="fa-solid fa-dumbbell"></i> MEU TREINO PRO</div>
                <div class="today-badge" id="userNameLabel">USUÁRIO</div>
            </div>

            <div class="progress-card">
                <div class="progress-info">
                    <span>Progresso Semanal</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
                <div class="user-info-banner" id="userStatsBanner">
                    <!-- Info via JS -->
                </div>
            </div>
        </header>

        <div class="day-tabs-container">
            <div class="day-tabs" id="dayTabs">
                <button class="tab-btn active" onclick="switchDay(0)">SEG<span class="tab-sub">Peito/Tri</span></button>
                <button class="tab-btn" onclick="switchDay(1)">TER<span class="tab-sub">Costas/Bi</span></button>
                <button class="tab-btn" onclick="switchDay(2)">QUA<span class="tab-sub">Pernas</span></button>
                <button class="tab-btn" onclick="switchDay(3)">QUI<span class="tab-sub">Ombros/Abs</span></button>
                <button class="tab-btn" onclick="switchDay(4)">SEX<span class="tab-sub">Braços/Ref</span></button>
            </div>
        </div>

        <main id="workout-container">
            <!-- As seções de cada dia são injetadas ou geradas via JS mantendo o padrão -->
        </main>
    </div>

    <!-- [CADASTRO / ONBOARDING] -->
    <div class="modal-overlay" id="onboardingModal">
        <div class="modal-content">
            <!-- Tela 1: Perfil -->
            <div class="onboarding-screen active" id="screen1">
                <h2 class="modal-title">Bem-vindo ao Pro!</h2>
                <div class="form-group">
                    <label class="form-label">Seu Nome</label>
                    <input type="text" id="regName" class="form-input" placeholder="Ex: João Silva">
                </div>
                <div style="display:flex; gap:10px">
                    <div class="form-group" style="flex:1">
                        <label class="form-label">Peso (kg)</label>
                        <input type="number" id="regWeight" class="form-input" placeholder="80">
                    </div>
                    <div class="form-group" style="flex:1">
                        <label class="form-label">Altura (cm)</label>
                        <input type="number" id="regHeight" class="form-input" placeholder="175">
                    </div>
                </div>
                <button class="btn-submit" onclick="nextScreen(2)">Próximo <i class="fa-solid fa-arrow-right"></i></button>
            </div>

            <!-- Tela 2: Objetivos -->
            <div class="onboarding-screen" id="screen2">
                <h2 class="modal-title">Qual seu objetivo?</h2>
                <div class="form-group">
                    <label class="form-label">Objetivo Principal</label>
                    <select id="regGoal" class="form-select">
                        <option value="Ganhar massa muscular">🏋️ Ganhar massa muscular</option>
                        <option value="Ganhar massa magra">💪 Ganhar massa magra</option>
                        <option value="Perder gordura">🔥 Perder gordura</option>
                        <option value="Emagrecer">⚖️ Emagrecer</option>
                        <option value="Perder gordura e ganhar massa">💪🔥 Perder gordura e ganhar massa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Frequência Semanal</label>
                    <select id="regFreq" class="form-select">
                        <option value="3">3 vezes por semana</option>
                        <option value="4">4 vezes por semana</option>
                        <option value="5">5 vezes por semana</option>
                        <option value="6">6 vezes por semana</option>
                    </select>
                </div>
                <button class="btn-submit" onclick="finishOnboarding()">Começar Treino! <i class="fa-solid fa-check"></i></button>
            </div>
        </div>
    </div>

    <!-- [MODAL: ADICIONAR EXERCÍCIO] -->
    <div class="modal-overlay" id="addExModal">
        <div class="modal-content">
            <h2 class="modal-title">Novo Exercício</h2>
            <div class="form-group">
                <label class="form-label">Escolha da Biblioteca ou Digite</label>
                <select id="librarySelect" class="form-select" onchange="syncLibraryFields()">
                    <option value="">-- Exercício Personalizado --</option>
                    <!-- Injetado via JS -->
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Nome do Exercício</label>
                <input type="text" id="newExTitle" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Séries x Repetições</label>
                <input type="text" id="newExSets" class="form-input" placeholder="4x 10">
            </div>
            <div style="display:flex; gap:10px">
                <button class="btn-submit" style="background:#444" onclick="closeAddEx()">Cancelar</button>
                <button class="btn-submit" onclick="confirmAddExercise()">Adicionar</button>
            </div>
        </div>
    </div>

    <div class="timer-widget" id="timerWidget">
        <div style="font-weight:800; color:var(--accent-primary)" id="timerDisplay">01:00</div>
        <button class="action-btn-sm" onclick="stopTimer()">Fechar</button>
    </div>

    <nav class="bottom-nav">
        <div class="nav-content">
            <button class="btn-action btn-quick-timer" onclick="startTimer(60)"><i class="fa-solid fa-stopwatch"></i> REST 60s</button>
            <button class="btn-action btn-reset" onclick="resetWeek()"><i class="fa-solid fa-rotate-left"></i> REINICIAR</button>
        </div>
    </nav>

    <script>
        // --- 1. BIBLIOTECA EXPANDIDA COM ANATOMIA ---

                { title: "Rosca Direta Barra W", primary: "Bíceps Braquial", secondary: "Braquiorradial", img: "img/rosca-direta.png" },
                { title: "Rosca Martelo", primary: "Braquiorradial", secondary: "Bíceps, Braquial", img: "img/martelo.png" }
            ],
            triceps: [
                { title: "Tríceps Pulley", primary: "Tríceps (Lateral)", secondary: "Ancôneo", img: "img/pulley.png" },
                { title: "Tríceps Testa", primary: "Tríceps (Longo)", secondary: "Ancôneo", img: "img/testa.png" }
            ],
            abs: [
                { title: "Crunch Abdominal", primary: "Reto Abdominal", secondary: "Oblíquos", img: "img/crunch.png" },
                { title: "Prancha Isométrica", primary: "Core (Transverso)", secondary: "Lombar, Ombros", img: "img/prancha.png" }
            ]
        };

        // --- 2. ESTADO DO APP ---
        let userData = JSON.parse(localStorage.getItem('proWorkout_user')) || null;
        let workoutData = JSON.parse(localStorage.getItem('proWorkout_exercises')) || null;
        let currentDayIndex = 0;
        let dayToAddEx = 0;

        // --- 3. INICIALIZAÇÃO ---
        window.onload = () => {
            if (!userData) {
                document.getElementById('onboardingModal').style.display = 'flex';
            } else {
                renderAll();
            }
            initDayByDate();
        };

        function nextScreen(s) {
            document.querySelectorAll('.onboarding-screen').forEach(scr => scr.classList.remove('active'));
            document.getElementById('screen' + s).classList.add('active');
        }

        function finishOnboarding() {
            const name = document.getElementById('regName').value;
            if(!name) return alert("Por favor, digite seu nome");
            
            userData = {
                name: name,
                weight: document.getElementById('regWeight').value,
                height: document.getElementById('regHeight').value,
                goal: document.getElementById('regGoal').value,
                freq: document.getElementById('regFreq').value
            };
            
            localStorage.setItem('proWorkout_user', JSON.stringify(userData));
            document.getElementById('onboardingModal').style.display = 'none';
            
            // Criar treino padrão inicial se vazio
            if(!workoutData) generateDefaultWorkout();
            renderAll();
        }

        function generateDefaultWorkout() {
            workoutData = [
                { day: "Segunda", muscle: "Peito + Tríceps", exercises: [
                    { id: Date.now()+1, title: "Supino Reto", sets: "4x 10", primary: "Peitoral Maior", secondary: "Tríceps", completed: false, load: "" },
                    { id: Date.now()+2, title: "Tríceps Pulley", sets: "3x 12", primary: "Tríceps", secondary: "Ancôneo", completed: false, load: "" }
                ]},
                { day: "Terça", muscle: "Costas + Bíceps", exercises: [] },
                { day: "Quarta", muscle: "Pernas", exercises: [] },
                { day: "Quinta", muscle: "Ombros + Abs", exercises: [] },
                { day: "Sexta", muscle: "Braços Completo", exercises: [] }
            ];
            saveWorkout();
        }

        function saveWorkout() {
            localStorage.setItem('proWorkout_exercises', JSON.stringify(workoutData));
            updateProgressStats();
        }

        function renderAll() {
            document.getElementById('userNameLabel').innerText = userData.name.toUpperCase();
            document.getElementById('userStatsBanner').innerHTML = `
                <span><i class="fa-solid fa-weight-scale"></i> ${userData.weight}kg</span>
                <span><i class="fa-solid fa-ruler-vertical"></i> ${userData.height}cm</span>
                <span><i class="fa-solid fa-bullseye"></i> ${userData.goal}</span>
            `;

            const container = document.getElementById('workout-container');
            container.innerHTML = '';

            workoutData.forEach((day, idx) => {
                const section = document.createElement('section');
                section.className = `day-section ${idx === currentDayIndex ? 'active' : ''}`;
                section.dataset.day = idx;

                section.innerHTML = `
                    <div class="section-header">
                        <h2 class="section-title">${day.day}-feira</h2>
                        <span class="muscle-group-tag"><i class="fa-solid fa-fire"></i> ${day.muscle}</span>
                    </div>
                    <div class="exercise-list" id="list-day-${idx}">
                        <!-- Exercícios via JS -->
                    </div>
                    <div class="add-ex-container">
                        <button class="btn-add-exercise" onclick="openAddEx(${idx})">
                            <i class="fa-solid fa-plus"></i> ADICIONAR EXERCÍCIO
                        </button>
                    </div>
                `;
                container.appendChild(section);
                renderDayExercises(idx);
            });
        }

        function renderDayExercises(dayIdx) {
            const list = document.getElementById(`list-day-${dayIdx}`);
            list.innerHTML = '';
            
            workoutData[dayIdx].exercises.forEach(ex => {
                const card = document.createElement('div');
                card.className = `exercise-card ${ex.completed ? 'completed' : ''}`;
                card.innerHTML = `
                    <div class="exercise-main-row" onclick="toggleEx(${dayIdx}, ${ex.id})">
                        <div class="checkbox-btn"><i class="fa-solid fa-check"></i></div>
                        <div class="exercise-info">
                            <div class="ex-title">${ex.title}</div>
                            <div class="anatomy-info">
                                <span class="primary-muscle">${ex.primary}</span>
                                <span class="secondary-muscles">• ${ex.secondary}</span>
                            </div>
                            <div class="ex-details-row">
                                <span class="ex-sets-badge">${ex.sets}</span>
                                <div class="exercise-actions">
                                    <button class="action-btn-sm delete" onclick="removeEx(event, ${dayIdx}, ${ex.id})"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="exercise-extra-row">
                        <div class="load-input-group">
                            <label style="font-size:0.7rem; color:var(--text-subtle)">CARGA:</label>
                            <input type="text" class="load-input" placeholder="0 kg" value="${ex.load}" 
                                onchange="updateLoad(${dayIdx}, ${ex.id}, this.value)">
                        </div>
                        <button class="action-btn-sm" style="color:var(--accent-primary)" onclick="startTimer(60)">
                            <i class="fa-regular fa-clock"></i> Descanso
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // --- 4. GESTÃO DE EXERCÍCIOS ---
        function openAddEx(dayIdx) {
            dayToAddEx = dayIdx;
            const select = document.getElementById('librarySelect');
            select.innerHTML = '<option value="">-- Personalizado --</option>';
            
            Object.keys(EXERCISE_LIBRARY).forEach(cat => {
                const group = document.createElement('optgroup');
                group.label = cat.toUpperCase();
                EXERCISE_LIBRARY[cat].forEach(ex => {
                    const opt = document.createElement('option');
                    opt.value = ex.title;
                    opt.dataset.primary = ex.primary;
                    opt.dataset.secondary = ex.secondary;
                    opt.innerText = ex.title;
                    group.appendChild(opt);
                });
                select.appendChild(group);
            });

            document.getElementById('addExModal').style.display = 'flex';
        }

        function closeAddEx() { document.getElementById('addExModal').style.display = 'none'; }

        function syncLibraryFields() {
            const select = document.getElementById('librarySelect');
            const selected = select.options[select.selectedIndex];
            if(selected.value !== "") {
                document.getElementById('newExTitle').value = selected.value;
            }
        }

        function confirmAddExercise() {
            const title = document.getElementById('newExTitle').value;
            const sets = document.getElementById('newExSets').value || "4x 10";
            if(!title) return alert("Digite o nome");

            const select = document.getElementById('librarySelect');
            const selected = select.options[select.selectedIndex];

            const newEx = {
                id: Date.now(),
                title: title,
                sets: sets,
                primary: selected.dataset.primary || "Personalizado",
                secondary: selected.dataset.secondary || "Geral",
                completed: false,
                load: ""
            };

            workoutData[dayToAddEx].exercises.push(newEx);
            saveWorkout();
            renderDayExercises(dayToAddEx);
            closeAddEx();
        }

        function removeEx(event, dayIdx, exId) {
            event.stopPropagation();
            if(confirm("Remover este exercício?")) {
                workoutData[dayIdx].exercises = workoutData[dayIdx].exercises.filter(e => e.id !== exId);
                saveWorkout();
                renderDayExercises(dayIdx);
            }
        }

        function toggleEx(dayIdx, exId) {
            const ex = workoutData[dayIdx].exercises.find(e => e.id === exId);
            ex.completed = !ex.completed;
            if (navigator.vibrate) navigator.vibrate(30);
            saveWorkout();
            renderDayExercises(dayIdx);
        }

        function updateLoad(dayIdx, exId, val) {
            const ex = workoutData[dayIdx].exercises.find(e => e.id === exId);
            ex.load = val;
            saveWorkout();
        }

        // --- 5. UTILITÁRIOS ---
        function switchDay(idx) {
            currentDayIndex = idx;
            document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
            document.querySelectorAll('.day-section').forEach((s, i) => s.classList.toggle('active', i === idx));
        }

        function initDayByDate() {
            const d = new Date().getDay(); // 0=Sun, 1=Mon...
            if(d >= 1 && d <= 5) switchDay(d-1);
        }

        function updateProgressStats() {
            let total = 0;
            let done = 0;
            workoutData.forEach(d => {
                total += d.exercises.length;
                done += d.exercises.filter(e => e.completed).length;
            });
            const perc = total > 0 ? Math.round((done / total) * 100) : 0;
            document.getElementById('progressPercent').innerText = perc + '%';
            document.getElementById('progressBarFill').style.width = perc + '%';
        }

        function resetWeek() {
            if(confirm("Zerar progresso da semana? Cargas e exercícios serão mantidos.")){
                workoutData.forEach(d => d.exercises.forEach(e => e.completed = false));
                saveWorkout();
                renderAll();
            }
        }

        // Timer Simples
        let timerInt;
        function startTimer(sec) {
            clearInterval(timerInt);
            let t = sec;
            document.getElementById('timerWidget').classList.add('active');
            timerInt = setInterval(() => {
                t--;
                const m = Math.floor(t/60);
                const s = t % 60;
                document.getElementById('timerDisplay').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if(t <= 0) {
                    clearInterval(timerInt);
                    if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    alert("Tempo de descanso acabou!");
                    stopTimer();
                }
            }, 1000);
        }
        function stopTimer() {
            clearInterval(timerInt);
            document.getElementById('timerWidget').classList.remove('active');
        }
    </script>
</body>
</html>
